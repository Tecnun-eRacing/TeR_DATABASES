name: Generar código C desde archivos dbc
on:
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main 

jobs:
  merge-dbc: # Compila los dbc en uno solo llamado ALL
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.8'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install cantools

        - name: Find and merge all DBC files
          run: |
            chmod +x ./utils/merge_dbc.py
            # Encuentra todos los dbcs
            DBC_FILES=$(find ./dbc-directory -name "*.dbc" | tr '\n' ' ')
            if [ -z "$DBC_FILES" ]; then
              echo "No DBC files found in the directory. Exiting."
              exit 1
            fi
            echo "Found DBC files: $DBC_FILES"
            ./utils/merge_dbc.py $DBC_FILES -o ALL.dbc

        - name: Upload merged DBC file
          uses: actions/upload-artifact@v3
          with:
            name: merged_database
            path: merged_database.dbc

  generate_c_code: # genera las librerías
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11  # Cambia a la versión de Python que necesites

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install cantools

    - name: Borrar archivos viejos
      run: |
        find . -name "*.c" -type f -delete
        find . -name "*.h" -type f -delete

    - name: Generar código C desde archivos dbc
      run: |
        dbc_files=$(find . -name "*.dbc")  # Encuentra todos los archivos .dbc en el directorio actual y subdirectorios
        sed -i '/^BA_/d' *.dbc    # Limpia los dbcs de mensajes de definicion de programas externos para que no de problemas
        for dbc_file in $dbc_files; do
          python3 -m cantools generate_c_source --use-float "$dbc_file" -o .  # Ejecuta el comando y redirige la salida al archivo
        done
    - name: Commit y push de los archivos
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "Añadir los archivos c generados"
        git push

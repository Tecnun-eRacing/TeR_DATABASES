name: Generar código C desde archivos dbc
on:
  push:
    branches:
      - main  # Cambia el nombre de la rama si es necesario
  pull_request:
    branches:
      - main  # Cambia el nombre de la rama si es necesario

jobs:
  generate_c_code:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código fuente
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11  # Cambia a la versión de Python que necesites

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install cantools

    - name: Crear carpeta c_codegen
      run: mkdir c_codegen

    - name: Generar código C desde archivos dbc
      run: |
        dbc_files=$(find . -name "*.dbc")  # Encuentra todos los archivos .dbc en el directorio actual y subdirectorios
        for dbc_file in $dbc_files; do
          python3 -m cantools generate_c_source "$dbc_file" -o c_codegen/  # Ejecuta el comando y redirige la salida al archivo
        done
    - name: Commit y push de los archivos
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add c_codegen
        git commit -m "Añadir los archivos c generados"
        git push
